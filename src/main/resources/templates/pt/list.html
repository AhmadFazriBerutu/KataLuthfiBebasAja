<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Trainers - FitManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <h2>FitManager Gym</h2>
    <div class="nav-menu">
        <a th:href="@{/pt/dashboard}">Dashboard</a>
        <a th:href="@{/pt/schedule}">Schedule</a>
        <a th:href="@{/pt/members}">Members</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>

<section class="page-container">

    <div class="page-header">
        <div>
            <h1>Trainers</h1>
            <p>Daftar semua trainer yang terdaftar di FitManager Gym.</p>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Trainers</h3>
            <p th:text="${trainers.size()}">0</p>
        </div>
    </div>

    <div class="trainer-grid">
        <div th:each="trainer : ${trainers}" class="trainer-card">
            <div class="trainer-avatar"
                 th:text="${#strings.length(trainer.nama) >= 2 ? #strings.substring(trainer.nama, 0, 2).toUpperCase() : trainer.nama.toUpperCase()}">TR</div>
            <h3 th:text="${trainer.nama}">Trainer Name</h3>
            <p class="trainer-role" th:text="${trainer.spesialisasi}">Specialization</p>
            <div class="trainer-info">
                <p><strong>Email:</strong> <span th:text="${trainer.email}">-</span></p>
                <p><strong>Phone:</strong> <span th:text="${trainer.telepon}">-</span></p>
            </div>
        </div>
        <tr th:if="${trainers.empty}">
            <td colspan="4" style="text-align:center;color:#94a3b8;padding:30px">Belum ada trainer terdaftar.</td>
        </tr>
    </div>

</section>

</body>
</html>
