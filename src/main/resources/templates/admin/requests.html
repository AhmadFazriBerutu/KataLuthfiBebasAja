<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>PT Requests - FitManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="navbar">
    <h2>FitManager Gym</h2>
    <div class="nav-menu">
        <a th:href="@{/admin/dashboard}">Dashboard</a>
        <a th:href="@{/admin/members}">Members</a>
        <a th:href="@{/admin/trainers}">Trainers</a>
        <a th:href="@{/admin/requests}" class="active">PT Requests</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>
<section class="page-container">
    <div class="page-header">
        <div>
            <h1>PT Requests</h1>
            <p>Kelola permintaan sesi Personal Trainer dari member.</p>
        </div>
    </div>
    <div class="table-card">
        <div class="table-header">
            <h2>Request List</h2>
        </div>
        <table class="member-table">
            <thead>
            <tr>
                <th>No</th>
                <th>Member</th>
                <th>Trainer</th>
                <th>Hari</th>
                <th>Jam</th>
                <th>Status</th>
                <th>Catatan CS</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="req, stat : ${requests}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${req.member.nama}">Member</td>
                <td th:text="${req.trainer.nama}">Trainer</td>
                <td th:text="${req.schedule.hari}">Hari</td>
                <td th:text="${req.schedule.jamMulai} + ' - ' + ${req.schedule.jamSelesai}">Jam</td>
                <td>
                    <span th:class="${req.status.name() == 'APPROVED'} ? 'badge active-badge' :
                                   (${req.status.name() == 'REJECTED'} ? 'badge inactive-badge' : 'badge')"
                          th:style="${req.status.name() == 'PENDING'} ? 'background:rgba(56,189,248,0.15);color:#38bdf8' : ''"
                          th:text="${req.status}">PENDING</span>
                </td>
                <td th:text="${req.catatanCs} ?: '-'">-</td>
                <td th:if="${req.status.name() == 'PENDING'}">
                    <form th:action="@{/admin/requests/approve/{id}(id=${req.id})}" method="post" style="display:inline">
                        <input type="hidden" name="catatan" value="Disetujui">
                        <button type="submit" class="action-btn edit-btn">Approve</button>
                    </form>
                    <form th:action="@{/admin/requests/reject/{id}(id=${req.id})}" method="post" style="display:inline">
                        <input type="hidden" name="catatan" value="Ditolak">
                        <button type="submit" class="action-btn delete-btn">Reject</button>
                    </form>
                </td>
                <td th:if="${req.status.name() != 'PENDING'}">-</td>
            </tr>
            <tr th:if="${requests.empty}">
                <td colspan="8" style="text-align:center;color:#94a3b8;padding:30px">Belum ada request PT.</td>
            </tr>
            </tbody>
        </table>
    </div>
</section>
</body>
</html>
