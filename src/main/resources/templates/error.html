<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Error - FitManager</title>
  <link rel="stylesheet" th:href="@{/css/style.css}">
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      text-align: center;
    }
    .error-code {
      font-size: 5rem;
      font-weight: 800;
      color: #e5e7eb;
      line-height: 1;
    }
    .error-title {
      font-size: 1.5rem;
      font-weight: 600;
      color: #111827;
      margin: 12px 0 8px;
    }
    .error-message {
      color: #6b7280;
      margin-bottom: 24px;
    }
  </style>
</head>
<body>
<div class="navbar">
  <h2>FitManager Gym</h2>
</div>
<section class="page-container">
  <div class="error-container">
    <div class="error-code" th:text="${status}">Error</div>
    <h2 class="error-title" th:text="${error}">Terjadi Kesalahan</h2>
    <p class="error-message" th:text="${message}">Halaman yang kamu cari tidak tersedia.</p>
    <a href="/admin/dashboard" class="btn-primary">Kembali ke Dashboard</a>
  </div>
</section>
</body>
</html>
