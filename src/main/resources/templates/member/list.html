<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Members - FitManager</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div class="navbar">
    <h2>FitManager Gym</h2>
    <div class="nav-menu">
        <a th:href="@{/member/dashboard}">Dashboard</a>
        <a th:href="@{/member/trainers}">Trainers</a>
        <a th:href="@{/member/my-requests}">My Requests</a>
        <a th:href="@{/logout}">Logout</a>
    </div>
</div>

<section class="page-container">

    <div class="page-header">
        <div>
            <h1>Members</h1>
            <p>Daftar member yang terdaftar di FitManager Gym.</p>
        </div>
    </div>

    <div class="stats-container">
        <div class="stat-card">
            <h3>Total Members</h3>
            <p th:text="${members.size()}">0</p>
        </div>
        <div class="stat-card">
            <h3>Active Members</h3>
            <p th:text="${totalActive}">0</p>
        </div>
        <div class="stat-card">
            <h3>Inactive Members</h3>
            <p th:text="${totalInactive}">0</p>
        </div>
    </div>

    <div class="table-card">
        <div class="table-header">
            <h2>Member List</h2>
            <input type="text" placeholder="Search member..." class="search-box">
        </div>
        <table class="member-table">
            <thead>
            <tr>
                <th>No</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Plan</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="member, stat : ${members}">
                <td th:text="${stat.count}">1</td>
                <td th:text="${member.nama}">Name</td>
                <td th:text="${member.email}">email</td>
                <td th:text="${member.telepon}">phone</td>
                <td th:text="${member.paket}">Plan</td>
                <td>
                    <span th:class="${member.active} ? 'badge active-badge' : 'badge inactive-badge'"
                          th:text="${member.active} ? 'Active' : 'Inactive'">Active</span>
                </td>
            </tr>
            <tr th:if="${members.empty}">
                <td colspan="6" style="text-align:center;color:#94a3b8;padding:30px">Belum ada member terdaftar.</td>
            </tr>
            </tbody>
        </table>
    </div>

</section>

</body>
</html>
