<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - FitManager Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<section class="login-page">

    <div class="login-left">
        <h1>FitManager Gym</h1>
        <p>
            Manage members, trainers, and gym activities in one modern platform.
        </p>

        <div class="login-highlights">
            <div>
                <h3>120+</h3>
                <span>Members</span>
            </div>

            <div>
                <h3>8</h3>
                <span>Trainers</span>
            </div>

            <div>
                <h3>2</h3>
                <span>Plans</span>
            </div>
        </div>
    </div>

    <div class="login-card">
        <div class="login-header">
            <h2>Admin Login</h2>
            <p>Masuk untuk mengelola data FitManager Gym.</p>
        </div>

        <form>
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="admin@fitmanager.com">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" placeholder="Enter your password">
            </div>

            <div class="login-options">
                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot password?</a>
            </div>

            <button type="button" class="btn-primary login-btn">Login</button>

            <a th:href="@{/}" class="back-home">Back to Home</a>
        </form>
    </div>

</section>

</body>
</html>
