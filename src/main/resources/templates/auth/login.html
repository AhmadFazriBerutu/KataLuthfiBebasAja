<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Login - FitManager Gym</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<section class="login-page">
    <div class="login-left">
        <h1>FitManager Gym</h1>
        <p>Manage members, trainers, and gym activities in one modern platform.</p>
        <div class="login-highlights">
            <div><h3>120+</h3><span>Members</span></div>
            <div><h3>8</h3><span>Trainers</span></div>
            <div><h3>2</h3><span>Plans</span></div>
        </div>
    </div>
    <div class="login-card">
        <div class="login-header">
            <h2>Login</h2>
            <p>Masuk untuk mengelola data FitManager Gym.</p>
        </div>
        <div th:if="${param.error}" style="color:#f87171;margin-bottom:16px;font-size:14px;">Username atau password salah.</div>
        <div th:if="${param.logout}" style="color:#4ade80;margin-bottom:16px;font-size:14px;">Berhasil logout.</div>
        <form th:action="@{/login}" method="post">
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="Masukkan username">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="Masukkan password">
            </div>
            <div class="login-options">
                <label><input type="checkbox" name="remember-me"> Remember me</label>
            </div>
            <button type="submit" class="btn-primary login-btn">Login</button>
        </form>
    </div>
</section>
</body>
</html>
